[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urls-dorks-searcher"
version = "1.0.0"
description = "Advanced URL Discovery & SQLi Security Auditor (URLS GOOGLE DORKS SEARCHER) - solo para auditorías de seguridad autorizadas"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Security Engineering" }]
dependencies = [
    "httpx>=0.27,<1.0",
    "PySide6>=6.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
